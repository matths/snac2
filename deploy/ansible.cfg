# Ansible reads this file automatically when you run ansible-playbook from
# inside deploy/, so no -i / -u flags are needed on the command line.
[defaults]
inventory = inventory.ini
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
# The playbooks escalate to root: backing up stops and starts the service and
# reads an instance directory only `snac` can read, and deploying installs the
# unit. Asking for the sudo password here means it cannot be forgotten on the
# command line; plain `ansible snac -m ping` still works without a password.
become_ask_pass = True
